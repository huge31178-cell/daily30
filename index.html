<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#f8f6f0" />
  <meta name="description" content="每天一页，快速阅读中国、全球和中文娱乐热点。新闻标题来源媒体RSS，点击查看原文。" />
  <title>每日30条 · 新闻速览</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="./app.js" defer></script>
</head>
<body>
 <main class="wrap">
  <header class="top">
    <div class="kicker"><span class="spark">✦</span> YOUR DAILY BRIEF <span class="slash">/</span> 每日新闻精选</div>
    <div class="hero-row">
      <div><h1>每日<span class="accent">30</span>条<span class="under">热点速览</span></h1><p class="tagline">中国大事 · 全球焦点 · 娱乐热搜 <span>一页读完今天</span></p></div>
      <div class="earth" aria-hidden="true">◉<span>✷</span></div>
    </div>
    <div class="meta"><div><span class="dot"></span><span id="stamp">新闻更新中…</span></div><span id="window"></span></div>
  </header>
  <div class="toolbar">
    <div class="tabs" role="tablist" aria-label="筛选分类">
      <button class="tab active" data-tab="all" aria-selected="true">全部 30 条</button>
      <button class="tab" data-tab="cn" aria-selected="false">中国热点</button>
      <button class="tab" data-tab="world" aria-selected="false">全球热点</button>
      <button class="tab" data-tab="ent" aria-selected="false">中国娱乐</button>
    </div>
    <div class="tools"><input id="search" type="search" placeholder="搜索标题 / 来源" aria-label="搜索新闻" /><button id="download" title="将当前30条新闻导出为PNG长图">↓ 导出长图</button></div>
  </div>
  <div id="notice" class="notice" aria-live="polite">正在加载最新新闻…</div>
  <div class="sections" id="sections"></div>
  <footer><span>数据为公开 RSS 标题索引 · 保留原媒体链接 · 仅供个人阅读</span><span>算法初排，非官方热搜榜 · 不保证覆盖全部重大新闻</span></footer>
 </main>
</body>
</html>
