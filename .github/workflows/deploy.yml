name: 每日新闻更新与网站发布

on:
  push:
    branches: [main]
    paths-ignore:
      - 'history/**'
      - 'data.json'
  schedule:
    # 北京时间 09:20 首次更新，10:20 如有必要补充当天精选日报信号。
    # 抓取窗口始终固定为昨天 09:00 到今天 09:00；两次不会变成两个日期。
    - cron: '20 1,2 * * *'
  workflow_dispatch:

permissions:
  contents: write  # 将每日快照存回仓库，供以后查询
  pages: write
  id-token: write

concurrency:
  group: daily30-publish
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (with history write permissions)
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build fixed 09:00 daily edition and history archive
        run: python update_news.py
      - name: Save the snapshot permanently to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json history/
          if ! git diff --cached --quiet; then
            git commit -m "Archive daily news $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No archive changes to commit"
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
